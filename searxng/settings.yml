# SearXNG settings — gregor (Schul-Metasuche, Port 80 via nginx).
# Owner: KI-Kustodiat-Repo (searxng/README.md). Stand 2026-10-19 (Instanz-Trennung).
#
# Egress: direkt aus dem Schulnetz — kein Proxy, keine Abhängigkeit von
# Operator-Infrastruktur.
#
# Engine-Kette (Client-Skill, Profil SEARXNG_CHAIN=strict):
#   bing -> yahoo -> braveapi
#   - braveapi ist server-seitig KEYLOS disabled: bis ein schuleigener
#     Brave-Search-Key beschafft ist, endet die Kette praktisch bei
#     bing/yahoo. KEIN privater Key des Operators hier.
#   - google/brave bleiben enabled fuer einen kuenftigen Upstream-Fix,
#     sind aber nicht in der Kette (google 403 searxng#5867, brave 429).
#   - github code läuft ohne ghc_auth (PAT entfernt, Instanz-Trennung).

use_default_settings:
  engines:
    keep_only:
      - braveapi
      - bing
      - yahoo
      - brave
      - google
      - mwmbl
      - searchmysite
      - wikipedia
      - arxiv
      - github
      - github code
      - npm
      - lib.rs
      - docker hub
      - arch linux wiki
      - gentoo
      - hackernews
      - bing news
      - duckduckgo news

server:
  # KEIN secret_key hier: SearXNG liest das Secret aus der Environment
  # SEARXNG_SECRET (/opt/searxng/.env, mode 600), wenn settings.yml den
  # Key nicht setzt (settings_defaults.SettingsValue, environ_name=
  # 'SEARXNG_SECRET'). Ein Platzhalter im File würde wörtlich übernommen.
  limiter: false
  image_proxy: true
  bind_address: "0.0.0.0"
  port: 8080

search:
  formats:
    - html
    - json
    - csv
    - rss

redis:
  url: redis://redis:6379/0

outgoing:
  request_timeout: 15.0
  max_request_timeout: 20.0

engines:
  - name: bing
    disabled: false
  - name: yahoo
    disabled: false
  - name: wikipedia
    display_type:
      - infobox
      - list
  - name: google
    disabled: false
  - name: braveapi
    engine: braveapi
    inactive: false
    disabled: true
  - name: mwmbl
    disabled: false
  - name: github code
    disabled: false
    inactive: false
  - name: searchmysite
    categories: general
    disabled: false

<!doctype html>
<html lang="de" data-theme="auto">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Portal derzeit nicht erreichbar — KI-Kustodiat</title>
    <!--
      Statische Ausfallseite für /portal (Issue #51).

      Sie liegt bewusst in `public/` und wird von Vite unverändert nach `dist/`
      kopiert, damit sie *ohne* den Node-Prozess existiert: nginx liefert sie
      per `error_page 502 503 504` aus, wenn `kik-portal.service` nicht läuft.
      Keine externen Ladevorgänge, kein JavaScript — die öffentliche Website
      bleibt in diesem Zustand vollständig funktionsfähig.

      Farben sind die Light-/Dark-Werte aus `src/styles/tokens.css`
      (`--color-canvas`, `--color-text`, `--color-primary`), hier statisch
      dupliziert, weil dieses Dokument kein Stylesheet lädt.
    -->
    <style>
      :root {
        color-scheme: light dark;
        --canvas: #fff;
        --text: #14191f;
        --muted: #5b6673;
        --primary: #0172ad;
        --border: rgba(20, 25, 31, 0.15);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --canvas: rgb(19, 22.5, 30.5);
          --text: #e8ecf2;
          --muted: #9aa6b4;
          --primary: #01aaff;
          --border: rgba(232, 236, 242, 0.2);
        }
      }
      html {
        font-size: 87.5%;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem 1rem;
        background: var(--canvas);
        color: var(--text);
        font-family:
          system-ui, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, Helvetica, Arial, sans-serif;
        line-height: 1.6;
      }
      main {
        max-width: 34rem;
        border: 1px solid var(--border);
        border-radius: 0.75rem;
        padding: 2rem;
      }
      h1 {
        margin-top: 0;
        font-size: 1.5rem;
        line-height: 1.25;
      }
      p {
        margin: 0 0 1rem;
      }
      p.small {
        margin-bottom: 0;
        color: var(--muted);
        font-size: 0.875rem;
      }
      a {
        color: var(--primary);
      }
      a:focus-visible {
        outline: 2px solid var(--primary);
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Portal derzeit nicht erreichbar</h1>
      <p>
        Das Token-Portal wird gerade gewartet oder der Portal-Dienst ist neu gestartet. Die
        öffentliche Website (Status, Angebote, FAQ, Anleitungen) läuft unabhängig davon weiter.
      </p>
      <p>Bitte lade diese Seite in ein bis zwei Minuten neu.</p>
      <p class="small">
        <a href="/">Zur Startseite</a> ·
        <a href="/status">Status</a> ·
        <a href="/faq">FAQ</a>
      </p>
    </main>
  </body>
</html>

<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KI-Kustodiat — offizielle Website</title>
  <link rel="canonical" href="https://kik.spengergasse.at">
  <style>
    :root { --blue:#2563eb; --ink:#1a1a1a; --bg:#f8fafc; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh;
      display: flex; align-items: center; justify-content: center; padding: 24px;
      font-family: 'Segoe UI', -apple-system, Roboto, sans-serif;
      color: var(--ink); background: var(--bg); line-height: 1.5;
    }
    main { text-align: center; max-width: 480px; }
    h1 { color: var(--blue); font-size: 1.6em; margin: 0 0 12px; }
    a.btn {
      display: inline-block; text-decoration: none; font-weight: 600;
      font-size: 1em; padding: 12px 24px; border-radius: 8px;
      background: var(--blue); color: #fff; transition: opacity .15s;
    }
    a.btn:hover { opacity: .85; }
  </style>
</head>
<body>
  <main>
    <h1>KI-Kustodiat</h1>
    <a class="btn" href="https://kik.spengergasse.at">Hier geht&rsquo;s zur offiziellen Website</a>
  </main>
</body>
</html>

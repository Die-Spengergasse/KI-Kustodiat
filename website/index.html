<!DOCTYPE html>
<html lang="de" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="KI-Kustodiat der Spengergasse — datenschutzkonforme KI-Infrastruktur für Unterricht, Coding und Recherche, betrieben auf schuleigenen Servern.">
  <title>kik.spengergasse.at — KI-Kustodiat</title>
  <link rel="icon" href="assets/favicon.ico">
  <!-- Pico + marked sind lokal vendored (keine externen Ladevorgänge). Versionen im README. -->
  <link rel="stylesheet" href="vendor/pico.min.css">
  <style>
    /* Pico-Skala auf Normalgröße: 87,5 % statt 100–131,25 % (alles rem → Zoom wirkt weiter). */
    :root { --pico-font-size: 87.5%; }
    .table-scroll { overflow-x: auto; }
    /* Lead-Absatz: erster Absatz der Startseite (aus content/index.md gerendert). */ 
    .home > p:first-of-type { font-size: 1.05em; }
    /* Blockquote-Callout (CTA am Ende der Startseite). */
    .home blockquote { border-left: 5px solid var(--pico-primary); padding-left: 1rem; }
    .home blockquote h3 { margin-top: 0; }

    /* Logo rechts in der Navigation, neben dem Farbschema-Button.
     * Spezifität: `.logo img` (0,1,1) schlägt `.logo-dark` (0,1,0) — die
     * Sichtbarkeit muss daher ebenfalls auf `.logo img.<variante>` liegen,
     * sonst steht im Hell-Schema das Dark-Radl als Artefakt unter dem Logo. */
    .logo img { height: 38px; width: auto; display: block; }
    .logo img.logo-light { display: block; }
    .logo img.logo-dark { display: none; }
    [data-theme="dark"] .logo img.logo-light { display: none; }
    [data-theme="dark"] .logo img.logo-dark { display: block; }

    /* Größerer Abstand unter der H1 auf der Startseite. */
    .home h1 { margin-bottom: 2.5rem; }

    /* Linksammlung als Karten-Raster. */
    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(13rem, 1fr)); gap: 0.75rem; margin: 1rem 0; }
    .cards a[role="button"] { display: block; text-align: center; margin: 0; }

    /* Markdown-Unterseiten. */
    #page article { padding: 0; margin: 0; background: none; box-shadow: none; }
    #page img { max-width: 100%; height: auto; }
    .back { display: inline-block; margin-bottom: 1rem; }
    .muted { color: var(--pico-muted-color); font-size: 0.9em; }

    @media (max-width: 640px) {
      .logo img { height: 28px; }
    }
  </style>
</head>
<body>
  <header class="container">
    <nav>
      <ul>
        <li><a href="#/" class="brand"><strong>KI-Kustodiat</strong></a></li>
      </ul>
      <ul>
        <li><button id="theme-toggle" class="outline secondary" aria-label="Farbschema wechseln">Farbschema: Auto</button></li>
        <li>
          <a href="#/" class="logo" aria-label="HTL Spengergasse — Startseite">
            <img class="logo-light" src="assets/spengergasse-logo.png" alt="HTL Spengergasse">
            <img class="logo-dark" src="assets/spengergasse-logo-dark.png" alt="" aria-hidden="true">
          </a>
        </li>
      </ul>
    </nav>
  </header>

  <main class="container">
    <!-- Startseite (Inhalt kommt aus content/index.md — siehe app.js) -->
    <div id="home" class="home">
      <p class="muted">Lade …</p>
      <noscript>
        <p>Dieser Inhalt braucht JavaScript. Direktlinks:</p>
        <p>
          <a href="https://openwebui.kik.spengergasse.at">Open WebUI Chat</a> ·
          <a href="https://github.com/Die-Spengergasse/KI-Kustodiat/discussions">Diskussion</a> ·
          <a href="https://github.com/Die-Spengergasse/KI-Kustodiat">Git-Repository</a>
        </p>
      </noscript>
    </div>

    <!-- Markdown-Unterseite (per Hash-Router gefüllt) -->
    <div id="page" hidden>
      <a href="#/" class="back">← Zur Startseite</a>
      <article id="page-content"></article>
    </div>
  </main>

  <footer class="container">
    <small>
      Georg Graf ·
      <a href="https://github.com/Die-Spengergasse/KI-Kustodiat">github.com/Die-Spengergasse/KI-Kustodiat</a>
    </small>
  </footer>

  <script src="vendor/marked.umd.js"></script>
  <script src="app.js"></script>
</body>
</html>

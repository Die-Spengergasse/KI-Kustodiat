services:
  db:
    image: postgres:16
    container_name: litellm-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: litellm
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm -d litellm"]
      interval: 10s
      timeout: 5s
      retries: 5

  litellm:
    # Pinned 2026-09-17 (litellm 1.101.0) — floating main-stable caused silent drift.
    # To upgrade: compose pull litellm, verify, then update this digest.
    image: ghcr.io/berriai/litellm:main-stable@sha256:d295634e09c648dcdb72c4cc2dd226f5fb87823a73e88cbbed6f205e4deb044b
    container_name: litellm
    restart: unless-stopped
    ports:
      - "11434:11434"
    env_file: .env
    environment:
      PYTHONPATH: /app
      DATABASE_URL: ${DATABASE_URL}
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./single_gpu_guard.py:/app/single_gpu_guard.py:ro
      - ./data:/app/data
    command: --config /app/config.yaml --host 0.0.0.0 --port 11434
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:11434/health/liveliness',timeout=5).status==200 else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s

  models-proxy:
    image: python:3.12-alpine
    container_name: litellm-models-proxy
    restart: unless-stopped
    ports:
      - "11436:8000"
    env_file: .env
    environment:
      LITELLM_INTERNAL_URL: http://litellm:11434
      LITELLM_PROXY_KEY: ${LITELLM_PROXY_KEY}
      LITELLM_PUBLIC_URL: ${LITELLM_PUBLIC_URL}
    volumes:
      - ./models_proxy.py:/app/models_proxy.py:ro
      - ./cache:/app/cache
    command: ["python", "/app/models_proxy.py"]
    depends_on:
      litellm:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz',timeout=5).status==200 else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  open-webui:
    # Pinned 2026-09-24 (open-webui v0.11.4, release tag) — floating main caused silent drift.
    # To upgrade: change the tag, compose pull open-webui, verify, then update this digest.
    image: ghcr.io/open-webui/open-webui:v0.11.4@sha256:9591b13f13843c7721c2b8eaf7382846c81b3ffe126526d1888d1fed50c6a33f
    container_name: open-webui
    restart: unless-stopped
    ports:
      - "3000:8080"
    environment:
      # LDAP-only auth (Issue #22). These env vars only SEED a fresh deployment; at
      # runtime the Open WebUI DB (`config` table) is authoritative.
      ENABLE_LDAP: true
      LDAP_SERVER_HOST: ldap.spengergasse.at
      LDAP_SERVER_PORT: 636
      LDAP_USE_SSL: true
      LDAP_ATTRIBUTE_FOR_USERNAME: sAMAccountName
      LDAP_SEARCH_FILTER: (objectClass=user)
      LDAP_SEARCH_BASE: OU=Automatisch gewartete Benutzer,OU=Benutzer,OU=SPG,DC=htl-wien5,DC=schule
      LDAP_APP_DN: CN=LDAP Test 01 (GRG),OU=LDAP,OU=Service-Accounts,OU=Manuell gewartete Benutzer,OU=Benutzer,OU=SPG,DC=htl-wien5,DC=schule
      LDAP_APP_PASSWORD: ${LDAP_APP_PASSWORD}
      OPENAI_API_BASE: http://litellm:11434/v1
      OPENAI_API_KEY: sk-gQrVR8-tgZnxF0Yxm_wo0Q
      WEBUI_SECRET_KEY: Tb5DkjD86gDSkBQcsurGNTxjAtZ67MRk1+jTPy/sTOw=
      ENABLE_SIGNUP: false
    volumes:
      - ./open-webui-data:/app/backend/data
    depends_on:
      litellm:
        condition: service_healthy

  whisper:
    image: hwdsl2/whisper-server:cuda
    container_name: whisper
    # Aktiv 2026-10-07: STT läuft lokal auf der GPU (large-v3, dauerhaft).
    # Ollama ist deaktiviert, daher keine VRAM-Konkurrenz. LiteLLM/GROQ nur
    # noch als dokumentierte Reserve (siehe whisper/README.md).
    restart: unless-stopped
    ports:
      - "11437:9000"
    environment:
      WHISPER_MODEL: large-v3
      WHISPER_DEVICE: cuda
      WHISPER_COMPUTE_TYPE: float16
      # auto = faster-whisper autodetect pro Request (verbose_json liefert
      # language + language_probability). Per-Request-`language` gewinnt immer.
      WHISPER_LANGUAGE: auto
      WHISPER_PORT: 9000
      WHISPER_BEAM: 5
      WHISPER_LOG_LEVEL: INFO
      WHISPER_API_KEY: ${WHISPER_API_KEY}
    volumes:
      - ./whisper-data:/var/lib/whisper
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

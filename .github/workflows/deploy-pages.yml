name: Deploy minimal index to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'pages/index.html'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble Pages site
        run: |
          set -euo pipefail
          mkdir -p public
          # Disable Jekyll processing so all files are served as-is.
          touch public/.nojekyll

          # Minimal index only: link to the real homepage (Kick-Rechner)
          # and to GitHub Discussions. Slides stay in the repo only.
          cp pages/index.html public/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
